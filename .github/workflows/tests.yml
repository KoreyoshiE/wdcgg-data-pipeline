name: Research-software tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Offline scientific tests
        run: python -m pytest -q
      - name: Synthetic-fixture reproduction smoke
        run: python scripts/smoke_reproduction.py
      - name: Public CLI help
        run: python scripts/reproduce_study.py --help
